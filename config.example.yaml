      api_base: http://localhost:11434

  - model_name: planner
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://localhost:11434

  - model_name: vision
    litellm_params:
      model: ollama_chat/qwen3-vl:4b
